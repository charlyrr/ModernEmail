name: Compilar APK ModernMail
run-name: APK ModernMail - ${{ github.ref_name }} - ${{ github.sha }}

# Se ejecuta en cada push a la rama estetica-moderna o a mano desde la pestaña Actions
on:
  push:
    branches: [ estetica-moderna ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Firma del APK:
      # - Con el secreto MODERN_KEYSTORE_PASSWORD se descifra la clave permanente del
      #   repositorio (app/modern.keystore.gpg): cada APK se instala encima del anterior.
      # - Sin el secreto se genera una clave temporal: el APK funciona, pero para
      #   actualizar hay que desinstalar la versión anterior.
      - name: Preparar la firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MODERN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f app/modern.keystore.gpg ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$KEYSTORE_PASSWORD" \
              -o app/modern.keystore -d app/modern.keystore.gpg
            PASS="$KEYSTORE_PASSWORD"
            echo "::notice::APK firmado con la clave permanente."
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore app/modern.keystore \
              -alias modern -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=ModernMail"
            echo "::warning::Firmado con una clave temporal. Falta el secreto MODERN_KEYSTORE_PASSWORD."
          fi
          echo "::add-mask::$PASS"
          {
            echo "storeFile=modern.keystore"
            echo "storePassword=$PASS"
            echo "keyAlias=modern"
            echo "keyPassword=$PASS"
          } > keystore.properties

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleGithubRelease

      - name: Subir el APK
        uses: actions/upload-artifact@v6
        with:
          name: ModernMail-APK
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
