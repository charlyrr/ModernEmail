name: Compilar APK ModernMail
run-name: APK ModernMail - ${{ github.ref_name }} - ${{ github.sha }}

# Se ejecuta en cada cambio de código en master, a mano desde la pestaña Actions,
# o lanzado por el flujo que incorpora las novedades de FairEmail
on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - '.gitattributes'
      - '.github/**'
  workflow_dispatch:

# "write" es necesario para publicar el APK en Releases
permissions:
  contents: write

concurrency:
  group: modern-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Firma del APK:
      # - Con el secreto MODERN_KEYSTORE_PASSWORD se descifra la clave permanente del
      #   repositorio (app/modern.keystore.gpg): cada APK se instala encima del anterior.
      # - Sin el secreto se genera una clave temporal: el APK funciona, pero para
      #   actualizar hay que desinstalar la versión anterior.
      - name: Preparar la firma
        id: firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MODERN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f app/modern.keystore.gpg ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$KEYSTORE_PASSWORD" \
              -o app/modern.keystore -d app/modern.keystore.gpg
            PASS="$KEYSTORE_PASSWORD"
            echo "permanente=true" >> "$GITHUB_OUTPUT"
            echo "::notice::APK firmado con la clave permanente."
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore app/modern.keystore \
              -alias modern -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=ModernMail"
            echo "::warning::Firmado con una clave temporal. Falta el secreto MODERN_KEYSTORE_PASSWORD."
          fi
          echo "::add-mask::$PASS"
          {
            echo "storeFile=modern.keystore"
            echo "storePassword=$PASS"
            echo "keyAlias=modern"
            echo "keyPassword=$PASS"
          } > keystore.properties

      # La primera compilación de una versión se publica como "1.3"; las siguientes
      # de la misma versión llevan el número de compilación ("1.3.21") para distinguirse.
      - name: Calcular la versión
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si el código es el mismo que el de la última versión publicada, no se repite
          ULTIMA="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .target_commitish 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$ULTIMA" ] \
              && git fetch -q --depth=1 origin "$ULTIMA" 2>/dev/null \
              && git diff --quiet "$ULTIMA" HEAD -- . ':(exclude)*.md' ':(exclude).github' ':(exclude).gitattributes'; then
            echo "omitir=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin cambios de código desde la última versión publicada: no se compila."
            exit 0
          fi
          BASE="$(grep -oP 'def modernMailVersion = "\K[^"]+' app/build.gradle)"
          if gh release view "v${BASE}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            VERSION="${BASE}.${{ github.run_number }}"
          else
            VERSION="${BASE}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Versión ${VERSION}"

      - name: Compilar
        if: steps.version.outputs.omitir != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PmmVersionName=${{ steps.version.outputs.version }} assembleGithubRelease

      - name: Subir el APK
        if: steps.version.outputs.omitir != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ModernMail-APK
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      # Publica el APK en Releases para poder actualizar desde el móvil (p. ej. con Obtainium).
      # Sólo con la clave permanente: un APK con firma temporal no se podría instalar encima.
      - name: Publicar en Releases
        if: steps.firma.outputs.permanente == 'true' && steps.version.outputs.omitir != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/github/release/*.apk "ModernMail-${VERSION}.apk"
          gh release create "v${VERSION}" "ModernMail-${VERSION}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ModernMail ${VERSION}" \
            --notes "ModernMail ${VERSION}. Qué es y qué cambia respecto a FairEmail: https://github.com/${{ github.repository }}#readme"
